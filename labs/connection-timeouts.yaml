# Lab: connection-timeouts   (needs a CNI that enforces NetworkPolicy; recent kind releases do,
#                             otherwise install Calico or Cilium first)
# Atlas:     index.html#/failures/connection-timeouts   (Markdown: docs/failures/connection-timeouts.md)
# Reproduce: kubectl apply -f labs/connection-timeouts.yaml
# Observe:   kubectl logs -n lab-connection-timeouts dispatch-worker -f   (wget: download timed out)
#            kubectl get networkpolicy -A
#            compare: kubectl run probe -n lab-connection-timeouts-orders --rm -it --restart=Never \
#              --image=busybox:1.36 -- wget -qO- -T 3 http://orders-api   (works from inside the namespace)
# Question:  why a timeout and not "connection refused"? What does that tell you about the hop?
# Fix:       add an ingress rule allowing namespace lab-connection-timeouts (see the commented block).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-connection-timeouts
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab-connection-timeouts-orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab-connection-timeouts-orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27
          ports:
            - { name: http, containerPort: 80 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: lab-connection-timeouts-orders
spec:
  selector: { app: orders-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-only
  namespace: lab-connection-timeouts-orders
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
    # - from:
    #     - namespaceSelector:
    #         matchLabels: { kubernetes.io/metadata.name: lab-connection-timeouts }
---
apiVersion: v1
kind: Pod
metadata:
  name: dispatch-worker
  namespace: lab-connection-timeouts
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- -T 3 http://orders-api.lab-connection-timeouts-orders >/dev/null && echo ok || echo 'wget: download timed out'; sleep 5; done"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
