# Lab: crashloopbackoff
# Atlas:     index.html#/failures/crashloopbackoff   (Markdown: docs/failures/crashloopbackoff.md)
# Reproduce: kubectl apply -f labs/crashloopbackoff.yaml
# Observe:   kubectl get pods -n lab-crashloopbackoff -w
#            kubectl logs -n lab-crashloopbackoff deploy/orders-api --previous
#            kubectl describe pod -n lab-crashloopbackoff -l app=orders-api   (Last State, Exit Code)
# Question:  is CrashLoopBackOff the problem, or the kubelet's response to it?
# Fix:       add the missing DATABASE_URL environment variable (see the commented lines), re-apply.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-crashloopbackoff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab-crashloopbackoff
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting orders-api"
              if [ -z "$DATABASE_URL" ]; then echo "fatal: DATABASE_URL is not set" >&2; exit 1; fi
              echo "connected to $DATABASE_URL"; while true; do sleep 3600; done
          # env:
          #   - name: DATABASE_URL
          #     value: postgres://orders-db.lab:5432/orders
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
