# Lab: hpa-unknown-metrics
# Atlas:     index.html#/failures/hpa-unknown-metrics   (Markdown: docs/failures/hpa-unknown-metrics.md)
# Reproduce: kubectl apply -f labs/hpa-unknown-metrics.yaml
# Observe:   kubectl get hpa -n lab-hpa-unknown-metrics   (cpu: <unknown>/70%)
#            kubectl describe hpa -n lab-hpa-unknown-metrics orders-api   (ScalingActive False)
# Question:  there are two root causes. The first is the missing metrics API. Install metrics-server
#            (`make metrics-server`), wait a minute, and read the conditions again: what is the second?
# Fix:       add a CPU request to the sidecar container (both containers need one), re-apply.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-hpa-unknown-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab-hpa-unknown-metrics
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: nginx:1.27
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
        - name: log-shipper
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits: { memory: 32Mi }    # a memory limit sets a memory request, but no CPU request
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
  namespace: lab-hpa-unknown-metrics
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orders-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
