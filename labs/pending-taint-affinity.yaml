# Lab: pending-taint-affinity   (needs `make kind-up`, which taints atlas-worker3 dedicated=batch:NoSchedule)
# Atlas:     index.html#/failures/pending-taint-affinity   (Markdown: docs/failures/pending-taint-affinity.md)
# Reproduce: kubectl apply -f labs/pending-taint-affinity.yaml
# Observe:   kubectl get pods -n lab-pending-taint-affinity
#            kubectl describe pod -n lab-pending-taint-affinity <pod> | sed -n '/Events/,$p'
#            kubectl get nodes -L larder.example/pool,topology.kubernetes.io/zone
#            kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints
# Question:  each pod is blocked by a different filter. Name the filter for each.
# Fix:       gpu-inference: no node has pool=gpu (remove the selector or label a node);
#            nightly-report: add the toleration shown in the comment.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-pending-taint-affinity
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-inference
  namespace: lab-pending-taint-affinity
spec:
  nodeSelector:
    larder.example/pool: gpu
  containers:
    - name: model
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: nightly-report
  namespace: lab-pending-taint-affinity
spec:
  nodeSelector:
    larder.example/pool: batch
  # tolerations:
  #   - { key: dedicated, operator: Equal, value: batch, effect: NoSchedule }
  containers:
    - name: report
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
