# Lab: pending-unbound-pvc   (also illustrates pvc-pending-provisioning)
# Atlas:     index.html#/failures/pending-unbound-pvc   (Markdown: docs/failures/pending-unbound-pvc.md), docs/failures/pvc-pending-provisioning.md
# Reproduce: kubectl apply -f labs/pending-unbound-pvc.yaml
# Observe:   kubectl describe pod -n lab-pending-unbound-pvc search-indexer | sed -n '/Events/,$p'
#            kubectl describe pvc -n lab-pending-unbound-pvc search-data | sed -n '/Events/,$p'
#            kubectl get storageclass
# Question:  the pod reports the problem. Which object owns it?
# Fix:       PVC classes are immutable: delete the pod and claim, set storageClassName to an existing
#            class (kind provides `standard`), re-apply.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-pending-unbound-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: search-data
  namespace: lab-pending-unbound-pvc
spec:
  storageClassName: gp3-encrypted    # does not exist in this cluster
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Pod
metadata:
  name: search-indexer
  namespace: lab-pending-unbound-pvc
spec:
  containers:
    - name: indexer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - { name: data, mountPath: /data }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: search-data }
