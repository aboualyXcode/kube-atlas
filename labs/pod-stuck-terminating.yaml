# Lab: pod-stuck-terminating
# Atlas:     index.html#/failures/pod-stuck-terminating   (Markdown: docs/failures/pod-stuck-terminating.md)
# Reproduce: kubectl apply -f labs/pod-stuck-terminating.yaml
#            kubectl delete pod search-indexer-0 -n lab-pod-stuck-terminating --wait=false
# Observe:   kubectl get pod -n lab-pod-stuck-terminating   (Terminating, indefinitely)
#            kubectl get pod search-indexer-0 -n lab-pod-stuck-terminating -o jsonpath='{.metadata.finalizers}'
# Question:  the container has already stopped. What is the API server still waiting for?
# Fix:       no controller will ever remove this finalizer, so remove it yourself:
#            kubectl patch pod search-indexer-0 -n lab-pod-stuck-terminating --type=json \
#              -p='[{"op":"remove","path":"/metadata/finalizers"}]'
apiVersion: v1
kind: Namespace
metadata:
  name: lab-pod-stuck-terminating
---
apiVersion: v1
kind: Pod
metadata:
  name: search-indexer-0
  namespace: lab-pod-stuck-terminating
  finalizers:
    - larder.example/flush-index
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: indexer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
