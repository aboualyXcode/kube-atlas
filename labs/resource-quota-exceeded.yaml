# Lab: resource-quota-exceeded
# Atlas:     index.html#/failures/resource-quota-exceeded   (Markdown: docs/failures/resource-quota-exceeded.md)
# Reproduce: kubectl apply -f labs/resource-quota-exceeded.yaml
# Observe:   kubectl get deploy,pods -n lab-resource-quota-exceeded   (READY 2/3 and no Pending pod)
#            kubectl describe rs -n lab-resource-quota-exceeded | sed -n '/Events/,$p'
#            kubectl describe resourcequota -n lab-resource-quota-exceeded
# Question:  where is the third replica, and why is there nothing to `kubectl describe pod`?
# Fix:       lower requests.cpu to 300m, or raise the quota's requests.cpu to "2", re-apply.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-resource-quota-exceeded
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: lab-resource-quota-exceeded
spec:
  hard:
    requests.cpu: "1"
    limits.memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab-resource-quota-exceeded
spec:
  replicas: 3
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: { cpu: 500m, memory: 32Mi }
            limits: { memory: 64Mi }
