# One internet-facing ALB for the storefront and the API, through the AWS Load Balancer Controller.
# Explained in the atlas (EKS networking).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip                     # straight to pod IPs
    alb.ingress.kubernetes.io/group.name: larder-public            # one ALB shared by the shop team's Ingresses
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:111122223333:certificate/0a1b2c3d-aaaa-bbbb-cccc-ddddeeeeffff
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /ready              # same endpoint as the readiness probe
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true
spec:
  ingressClassName: alb
  rules:
    - host: shop.larder.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: storefront, port: { name: http } }
    - host: api.larder.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: orders-api, port: { name: http } }
