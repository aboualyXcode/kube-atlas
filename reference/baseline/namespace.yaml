# What every application namespace gets. Shown for `shop`; Larder templates it for each namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled   # rollouts wait for healthy ALB targets
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "60"          # sized for peak replicas plus rollout surge
    requests.memory: 120Gi
    limits.memory: 160Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-defaults
  namespace: shop
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }   # requests always; no default CPU limit
      default: { memory: 256Mi }
      max: { memory: 8Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: shop
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-alb
  namespace: shop
spec:
  podSelector:
    matchLabels: { larder.example/exposed: "true" }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock: { cidr: 10.20.0.0/22 }     # public subnets, where ALB nodes live (target-type: ip)
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-data-and-aws
  namespace: shop
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: { cidr: 10.20.0.0/16 }     # data subnets (Aurora, ElastiCache) and VPC endpoints
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }   # EKS Pod Identity agent
      ports:
        - { protocol: TCP, port: 80 }
